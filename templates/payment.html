<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Document</title>
  </head>
  <body>
    <main>
      <header>
        <h1>Payment Document</h1>
      </header>

      <section aria-labelledby="payment-details-heading">
        <h2 id="payment-details-heading">Payment details</h2>
        <dl>
          <dt>Generation date</dt>
          <dd>2026-01-01T00:00:00Z</dd>

          <dt>Recipient</dt>
          <dd>Example Recipient</dd>

          <dt>IBAN</dt>
          <dd>DE89370400440532013000</dd>

          <dt>Amount</dt>
          <dd>EUR 12.34</dd>

          <dt>Payment reference</dt>
          <dd>Invoice 2026-001</dd>
        </dl>
      </section>

      <section aria-labelledby="qr-heading">
        <h2 id="qr-heading">QR code</h2>
        <p>Embedded QR code placeholder.</p>
      </section>
    </main>
  </body>
</html>
